<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:layout="http:/www.ultraq.net.nz/thymeleaf/layout"
                layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title>상품 아이템 등록</title>
    <!-- 페이지별 CSS -->
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/item.css}">
    </th:block>
</head>
<body>
<!-- 메인 컨텐츠 -->
<main layout:fragment="content">
    <h1>새 아이템</h1>
    <form id="itemForm" method="post" th:action="@{/items}">
        <label for="item_id">아이템(과일): </label>
        <input id="item_id" name="item" required type="text">
        <button type="submit">아이템 등록</button>
    </form>
</main>
<!-- 페이지별 스크립트 -->
<th:block layout:fragment="script">
    <script th:src="@{/js/items.js}"></script>
</th:block>
</body>
</html>
